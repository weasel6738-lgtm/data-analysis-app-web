services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      ORCHESTRATOR_PROVIDER: local
      DRAFT_PROVIDER: local
      CORS_ORIGINS: http://localhost:8000,http://localhost:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
